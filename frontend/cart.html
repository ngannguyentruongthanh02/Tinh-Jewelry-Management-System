<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng | TĨNH Jewelry</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <div class="page-head"><h1>Giỏ hàng</h1></div>

  <section class="section" style="padding-top:30px">
    <div class="cart-layout" id="cart-layout">
      <table class="cart-table">
        <thead>
          <tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th><th></th></tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>
      <aside class="summary">
        <h3>Tóm tắt đơn hàng</h3>
        <div class="row"><span>Tạm tính</span><span id="sum-sub">0đ</span></div>
        <div class="row"><span>Vận chuyển</span><span id="sum-ship">0đ</span></div>
        <div class="row total"><span>Tổng cộng</span><span id="sum-total">0đ</span></div>
        <p class="note" id="sum-note"></p>
        <a href="checkout.html" class="btn btn-block">Tiến hành thanh toán</a>
        <a href="products.html" class="btn btn-outline btn-block">Tiếp tục mua sắm</a>
      </aside>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
