<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | TĨNH Jewelry</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div id="site-header"></div>

  <div class="form-card">
    <div class="tabs">
      <button class="tab active" data-tab="login">Đăng nhập</button>
      <button class="tab" data-tab="register">Đăng ký</button>
    </div>

    <form id="login-form">
      <div class="field"><label for="l-email">Email</label><input class="input" id="l-email" type="email" required></div>
      <div class="field"><label for="l-pass">Mật khẩu</label><input class="input" id="l-pass" type="password" required></div>
      <div class="form-msg" id="l-msg"></div>
      <button class="btn btn-block" type="submit">Đăng nhập</button>
    </form>

    <form id="register-form" hidden>
      <div class="field"><label for="r-name">Họ và tên</label><input class="input" id="r-name" required></div>
      <div class="field"><label for="r-email">Email</label><input class="input" id="r-email" type="email" required></div>
      <div class="field"><label for="r-phone">Số điện thoại</label><input class="input" id="r-phone" type="tel" required></div>
      <div class="field"><label for="r-pass">Mật khẩu (tối thiểu 6 ký tự)</label><input class="input" id="r-pass" type="password" required></div>
      <div class="field"><label for="r-pass2">Nhập lại mật khẩu</label><input class="input" id="r-pass2" type="password" required></div>
      <div class="form-msg" id="r-msg"></div>
      <button class="btn btn-block" type="submit">Tạo tài khoản</button>
    </form>
  </div>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script></body>
</html>
