<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị | TĨNH Jewelry</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="admin-login" class="admin-login-body">
  <div class="form-card admin-login-card">
    <a href="../index.html" class="logo" style="display:block;text-align:center;margin-bottom:6px">TĨNH</a>
    <p style="text-align:center;color:var(--accent);margin-bottom:28px;font-size:13px;letter-spacing:2px;text-transform:uppercase">Khu vực quản trị</p>

    <form id="admin-login-form" novalidate>
      <div class="field"><label for="a-user">Tên đăng nhập</label><input class="input" id="a-user" autocomplete="username" autofocus></div>
      <div class="field"><label for="a-pass">Mật khẩu</label><input class="input" id="a-pass" type="password" autocomplete="current-password"></div>
      <div class="form-msg" id="a-msg"></div>
      <button class="btn btn-block" type="submit">Đăng nhập</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:13px"><a href="../index.html" style="color:var(--accent)">← Về trang cửa hàng</a></p>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
